services:
  whatdvd:
    build: .
    image: whatdvd:latest
    container_name: whatdvd
    # 与宿主机上媒体文件的属主一致，保证能读取媒体、写入输出目录
    user: "1000:1000"
    ports:
      # 只映射到宿主机本机；远程访问请用 SSH 隧道或 HTTPS 反向代理
      - "127.0.0.1:26873:26873"
    # 登录 token 首次启动自动生成并保存在 ./output/.whatdvd/token；
    # 查看：docker exec whatdvd whatdvd token。需要时取消下面相应行的注释：
    # environment:
    #   WHATDVD_TOKEN: "你的 token"
    #   # 使用资源获取时，qB 密码和 Jackett API Key 可以放在这里，不写进配置文件：
    #   WHATDVD_QB_PASSWORD: "..."
    #   WHATDVD_JACKETT_API_KEY: "..."
    volumes:
      - /path/to/downloads:/media:ro
      # 使用资源获取时，把 qB 的下载目录也挂载进来（要在 /media 之内），并在设置页面的“路径映射”中填写
      # “qB 中的目录 = 容器里的目录”。qB 不在 Docker 里时，例如 qB 存到 /home/me/qb：
      #   挂载 - /home/me/qb:/media/qb:ro，路径映射填 /home/me/qb = /media/qb，
      #   “qB 保存路径”留空或填 /home/me/qb（qB 那边的路径），不要填 /media/qb。
      # - /path/to/qb/downloads:/media/qb:ro
      - ./output:/output
      # 使用发种目录（硬链接）时：下载目录和发种目录必须在同一个挂载卷里（分开挂载无法建硬链接），
      # 而且要可写。可以挂载它们共同的上级目录，代替上面的 /media，再在配置中设置
      # roots = ["/data/downloads"]、seed_dir = "/data/seed"：
      # - /path/to/data:/data
      # 需要改配置时再挂载自己的文件：
      # - ./config.toml:/config/config.toml:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
