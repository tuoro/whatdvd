# whatdvd Web 界面配置示例
# 复制到 ~/.config/whatdvd/config.toml，或用 whatdvd serve -c 指定路径。

# 默认只监听本机。远程访问请用 SSH 隧道或 HTTPS 反向代理，不要直接暴露到公网。
host = "127.0.0.1"
port = 26873

# 登录用的 token。留空时第一次启动自动生成，保存在 token_file 中，之后重启不变；
# 运行 whatdvd token 查看。也可以在这里或环境变量 WHATDVD_TOKEN 中直接指定。
token = ""
token_file = "~/.local/share/whatdvd/token"

# 允许在界面中浏览和处理的目录，界面无法访问这些目录以外的文件
roots = ["~/downloads"]

# 截图、MediaInfo、发布说明和种子的输出目录，每个任务在其中按名称建子目录
output_dir = "~/.local/share/whatdvd/output"

# ISO 解包用的临时目录；留空用系统临时目录。解包会写入约 1 GB 的 VOB，/tmp 空间小时请指定
temp_dir = ""

# 同时运行的任务数
max_jobs = 1

# 资源候选与下载状态（SQLite），用于下面的“资源获取”
database = "~/.local/share/whatdvd/whatdvd.db"

# 设置页面保存的设置。截图、图床、做种、模板、任务数、qBittorrent、Jackett 都可以在设置页面中修改，
# 保存在这里并覆盖本文件中的同名项；监听地址、token、roots、输出目录、数据库只能在本文件中修改。
settings_file = "~/.local/share/whatdvd/settings.json"

[screenshots]
count = 10
# 截图比例修正："ua"（同 Upload-Assistant，只放大不缩小，例如 NTSC 4:3 → 720x540，NTSC 16:9 → 854x480）
#            "minfo"（按 DAR，高度不变，例如 NTSC 4:3 → 640x480）
#            或 "jietu"（按 PAR，只放大不缩小，例如 NTSC 4:3 → 720x540）
aspect = "ua"
# 剔除黑屏（同 Upload-Assistant）：多截一张删掉体积最小的，小于 120 KB 的换时间点重截
dark_filter = true

[pixhost]
domain = "pixhost.to"   # 或备用域名 pixhost.cc
proxy = ""              # 例如 http://127.0.0.1:7890

[torrent]
announces = []          # 做种表单里预填的 Tracker 地址
piece_length = 24       # 2^24 = 16 MiB，同 zuozhong

[post]
template = ""           # 发布说明模板文件；留空用默认 BBCode。变量：$name、$mediainfo、$screenshots

# ---------- 资源获取（可选） ----------
# 用 Jackett 搜索 DVD 原盘，在界面中点“下载”推送到 qBittorrent，下载完成后自动截图、
# 生成 MediaInfo、上传图床和发布说明。两段都不填时不启用。
# 只填 [qbittorrent] 时：在 qB 中添加到该分类的种子，下载完成后同样会自动处理。

# [qbittorrent]
# url = "http://127.0.0.1:8080"
# username = "admin"
# password = ""                # 也可以用环境变量 WHATDVD_QB_PASSWORD
# category = "whatdvd"         # 推送时使用的分类；这个分类下下载完成的种子都会自动处理
# save_path = ""               # qB 中的保存路径；留空用分类或 qB 的默认路径
# interval = 60                # 检查下载进度的间隔（秒）
# # qB 和 whatdvd 看到的路径不同时（例如不在同一台机器或同一个容器）：{ qB 中的路径 = whatdvd 中的路径 }。
# # 映射后的下载目录必须在 roots 之内，否则不会处理。
# path_map = { "/downloads" = "/home/me/downloads" }

# [jackett]
# url = "http://127.0.0.1:9117"
# api_key = ""                 # Jackett 页面右上角的 API Key；也可以用环境变量 WHATDVD_JACKETT_API_KEY
# indexer = "all"              # Jackett 中的站点 ID，例如 rutracker、rutor、kinozal；all 为全部已配置的站点
# queries = ["DVD9", "DVD5"]   # 每次搜索的关键词
# interval = 60                # 自动搜索的间隔（分钟）；0 为只在界面中手动搜索
# films_only = true            # 只要影视类（Torznab 分类 2000 电影、5000 电视），去掉音乐、培训、体育等

# [rutor]                      # rutor 直连：直接读取 rutor 的搜索页并翻页，比通过 Jackett 拿到的多（公开站，不需要账号）
# url = "https://rutor.info"   # 或镜像 https://rutor.is；启用后建议在 Jackett 中去掉 rutor
# queries = ["DVD9", "DVD5"]
# interval = 60                # 自动搜索的间隔（分钟），只读最新的一页；0 为只手动搜索
# films_only = true            # 只要影视类：去掉 rutor 音乐、其他、体育分类中的结果
