<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>whatdvd</title>
  <link rel="icon" href="data:,">
  <link rel="preload" href="/static/fonts/Manrope.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <div id="login" class="login" hidden>
    <form id="login-form" class="login-card">
      <span class="disc-mark xl" aria-hidden="true"></span>
      <div class="login-title">
        <h1>whatdvd</h1>
        <p>DVD 发种助手</p>
      </div>
      <label class="field">
        <span>访问 token</span>
        <input id="login-token" type="password" autocomplete="current-password" placeholder="启动时设置或打印的 token" required>
      </label>
      <p class="login-hint">token 在第一次启动时生成并保存。在服务器上运行 <code>whatdvd token</code> 查看；Docker 部署运行 <code>docker exec whatdvd whatdvd token</code>。</p>
      <p id="login-error" class="form-error" hidden></p>
      <button type="submit" class="btn light block">登录</button>
    </form>
  </div>

  <div id="app" class="shell" hidden>
    <aside class="sidebar">
      <div class="brand">
        <span class="disc-mark" aria-hidden="true"></span>
        <strong>whatdvd</strong>
        <a id="nav-settings" class="icon-btn" href="#/settings" title="设置" aria-label="设置"></a>
        <button id="logout" type="button" class="icon-btn" title="退出登录" aria-label="退出登录"></button>
      </div>

      <a id="nav-releases" class="side-nav" href="#/releases" hidden><span>资源</span><span id="release-count" class="count"></span></a>

      <section class="side-block" aria-labelledby="library-title">
        <h2 id="library-title" class="side-label">媒体库 <button id="check-all" type="button" class="link-btn">全选</button></h2>
        <nav id="crumbs" class="crumbs" aria-label="当前位置"></nav>
        <ul id="entries" class="entries"></ul>
        <p id="browse-error" class="form-error" hidden></p>
      </section>

      <section class="side-block tasks-block" aria-labelledby="tasks-title">
        <h2 id="tasks-title" class="side-label">任务 <span id="task-count" class="count"></span></h2>
        <p id="tasks-empty" class="side-empty">还没有任务</p>
        <ul id="tasks" class="tasks"></ul>
      </section>
    </aside>

    <main id="main" class="main"></main>

    <div id="batch" class="batch" role="region" aria-label="批量操作" hidden>
      <span id="batch-count"></span>
      <button type="button" class="btn amber small" data-batch="run">批量截图</button>
      <button type="button" class="btn glass small" data-batch="torrent">批量做种</button>
      <button type="button" class="btn glass small" data-batch="both">两者</button>
      <button type="button" class="btn glass small" data-batch="clear">取消</button>
    </div>
    <div id="toast" class="toast" role="status" hidden></div>
  </div>
</body>
</html>
