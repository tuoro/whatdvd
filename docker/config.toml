# 容器内使用的配置。路径都是容器内路径，对应 docker-compose.yml 中的挂载。
# 登录 token：第一次启动时自动生成，保存在输出卷的 .whatdvd/token 中，重启不变。
# 查看：docker exec whatdvd whatdvd token。想自己指定，可以设置环境变量 WHATDVD_TOKEN。

port = 26873
token_file = "/output/.whatdvd/token"
roots = ["/media"]
output_dir = "/output"
# 发种目录（硬链接，也可以在设置页面填写）：必须和下载目录在同一个挂载卷里，见 docker-compose.yml 中的说明
# seed_dir = "/data/seed"
# ISO 解包会临时写入约 1 GB 的 VOB，放在输出卷里，避免占用容器的可写层或内存
temp_dir = "/output/.tmp"
max_jobs = 1
database = "/output/.whatdvd/whatdvd.db"
# 设置页面保存的设置，覆盖本文件中的同名项
settings_file = "/output/.whatdvd/settings.json"

[screenshots]
count = 10
# 截图比例修正："ua"（同 Upload-Assistant，只放大不缩小，例如 NTSC 4:3 → 720x540，NTSC 16:9 → 854x480）
#            "minfo"（按 DAR，高度不变，例如 NTSC 4:3 → 640x480）
#            或 "jietu"（按 PAR，只放大不缩小，例如 NTSC 4:3 → 720x540）
aspect = "ua"
# 剔除黑屏（同 Upload-Assistant）：多截一张删掉体积最小的，小于 120 KB 的换时间点重截
dark_filter = true

[pixhost]
domain = "pixhost.to"
proxy = ""

[torrent]
announces = []
piece_length = 24

# ---------- 资源获取（可选） ----------
# 用 Jackett 搜索 DVD 原盘，在界面中点“下载”推送到 qBittorrent，下载完成后自动截图、
# 生成 MediaInfo、上传图床和发布说明。两段都不填时不启用。
# 只填 [qbittorrent] 时：在 qB 中添加到该分类的种子，下载完成后同样会自动处理。
# 注意：容器里的 127.0.0.1 是容器自己。qB 和 Jackett 在宿主机上时填宿主机的局域网地址，
# 在同一个 compose 网络里时填服务名，例如 http://qbittorrent:8080。

# [qbittorrent]
# url = "http://127.0.0.1:8080"
# username = "admin"
# password = ""                # 也可以用环境变量 WHATDVD_QB_PASSWORD
# category = "whatdvd"         # 推送时使用的分类；这个分类下下载完成的种子都会自动处理
# save_path = ""               # qB 中的保存路径；留空用分类或 qB 的默认路径
# interval = 60                # 检查下载进度的间隔（秒）
# seed_category = "whatdvd-seed"  # “添加到 qB 做种”用的分类，必须和 category 不同
# # qB 和 whatdvd 看到的路径不同时（例如不在同一台机器或同一个容器）：{ qB 中的路径 = whatdvd 中的路径 }。
# # 映射后的下载目录必须在 roots 之内，否则不会处理。
# path_map = { "/downloads" = "/media/qb" }

# [tmdb]                       # 查片名：按 IMDb / TMDB 的英文名和原名给出 PTP 发种名称和 BHD 标题
# api_key = ""                 # themoviedb.org 的 API Key 或读取令牌；也可以用环境变量 WHATDVD_TMDB_API_KEY

# [jackett]
# url = "http://127.0.0.1:9117"
# api_key = ""                 # Jackett 页面右上角的 API Key；也可以用环境变量 WHATDVD_JACKETT_API_KEY
# indexer = "all"              # Jackett 中的站点 ID，例如 rutracker、rutor、kinozal；all 为全部已配置的站点
# queries = ["DVD9", "DVD5"]   # 每次搜索的关键词
# interval = 60                # 自动搜索的间隔（分钟）；0 为只在界面中手动搜索
# films_only = true            # 只要影视类（Torznab 分类 2000 电影、5000 电视），去掉音乐、培训、体育等

# [rutor]                      # rutor 直连：直接读取 rutor 的搜索页并翻页，比通过 Jackett 拿到的多（公开站，不需要账号）
# url = "https://rutor.info"   # 或镜像 https://rutor.is；启用后建议在 Jackett 中去掉 rutor
# queries = ["DVD9", "DVD5"]
# interval = 60                # 自动搜索的间隔（分钟），只读最新的一页；0 为只手动搜索
# films_only = true            # 只要影视类：去掉 rutor 音乐、其他、体育分类中的结果
