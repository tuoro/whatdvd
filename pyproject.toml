[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "whatdvd"
version = "0.1.0"
description = "DVD 发种助手：为 VIDEO_TS 或 ISO 生成截图、MediaInfo、种子和发布说明"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "httpx>=0.27",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.10"]

[project.scripts]
whatdvd = "whatdvd.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/whatdvd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: 需要 ffmpeg、ffprobe、mediainfo、dvdauthor 等外部命令",
]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
