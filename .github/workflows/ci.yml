name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装外部命令
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg mediainfo dvdauthor genisoimage p7zip-full mktorrent
      - name: 安装项目
        run: python -m pip install -e ".[dev]"
      - name: 类型检查
        run: python -m mypy --strict src
      - name: 测试
        run: python -m pytest
